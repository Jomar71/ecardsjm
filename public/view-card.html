<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Card | Compartida</title>
    <meta name="description" content="Tarjeta digital - E-Cards JM">
    <meta property="og:type" content="website">
    <meta property="og:title" content="E-Card Compartida">
    <meta property="og:description" content="Tarjeta digital - E-Cards JM">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body.card-body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ink-sunken);
            overflow: auto;
        }

        body.card-body::after {
            opacity: 0.18;
        }

        /* ---------- La tarjeta ---------- */
        .view-card-wrapper {
            position: relative;
            /* La tarjeta nunca debe exceder la altura de la pantalla */
            width: min(100vw, 460px, calc((100vh - 40px) * 9 / 16));
            aspect-ratio: 9 / 16;
            background: var(--ink-raised);
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.95);
        }

        @supports (height: 100dvh) {
            .view-card-wrapper {
                width: min(100vw, 460px, calc((100dvh - 40px) * 9 / 16));
            }
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            padding: clamp(18px, 4vw, 28px);
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(to top, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.08) 46%, transparent 72%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.48) 0%, transparent 34%);
        }

        .card-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 2vw, 14px);
            text-align: center;
        }

        .card-logo {
            width: clamp(56px, 15vw, 88px);
            height: clamp(56px, 15vw, 88px);
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(12, 14, 20, 0.45);
            display: none;
            flex: 0 0 auto;
        }

        .card-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-identity {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 5.2vw, 2rem);
            font-weight: 600;
            font-variation-settings: 'SOFT' 0, 'WONK' 0;
            line-height: 1.08;
            letter-spacing: -0.02em;
            color: #fff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
        }

        .card-role {
            font-size: clamp(0.72rem, 2.6vw, 0.84rem);
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
        }

        .vertical-icons {
            position: absolute;
            left: clamp(14px, 4vw, 26px);
            bottom: clamp(88px, 17vh, 150px);
            display: flex;
            flex-direction: column;
            gap: clamp(9px, 1.8vh, 14px);
        }

        .social-row {
            position: absolute;
            left: clamp(14px, 4vw, 26px);
            right: clamp(14px, 4vw, 26px);
            bottom: clamp(14px, 4vh, 30px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(8px, 2.2vw, 13px);
            padding-right: clamp(66px, 17vw, 96px);
        }

        .icon-circle {
            width: clamp(28px, 6vw, 38px);
            height: clamp(28px, 6vw, 38px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.8rem, 3.2vw, 1rem);
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(12, 14, 20, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease);
        }

        .icon-circle:hover {
            transform: scale(1.08);
            background: rgba(12, 14, 20, 0.75);
        }

        .qr-placeholder {
            position: absolute;
            right: clamp(14px, 4vw, 26px);
            bottom: clamp(14px, 4vh, 30px);
            width: clamp(58px, 15vw, 86px);
            height: clamp(58px, 15vw, 86px);
            background: #fff;
            padding: clamp(5px, 1.2vw, 7px);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .qr-placeholder img,
        .qr-placeholder canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media (min-width: 600px) {
            .view-card-wrapper {
                border-radius: var(--r-card);
            }
        }

        @media (max-width: 600px) {
            .view-card-wrapper {
                width: min(100vw, calc((100vh - 16px) * 9 / 16));
            }
        }

        @supports (height: 100dvh) {
            @media (max-width: 600px) {
                .view-card-wrapper {
                    width: min(100vw, calc((100dvh - 16px) * 9 / 16));
                }
            }
        }

        /* ---------- Portada antes de abrir la tarjeta ---------- */
        .preview-splash {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--ink-sunken);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            transition: opacity 420ms var(--ease), visibility 420ms var(--ease);
        }

        .preview-splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .preview-thumb {
            position: relative;
            width: min(64vw, 250px, calc((100vh - 200px) * 9 / 16));
            aspect-ratio: 9 / 16;
            border-radius: var(--r-card);
            background: var(--ink-raised);
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transform: rotate(-2deg);
            box-shadow:
                0 1px 0 rgba(243, 238, 229, 0.1),
                0 34px 64px -26px rgba(0, 0, 0, 0.95);
        }

        @supports (height: 100dvh) {
            .preview-thumb {
                width: min(64vw, 250px, calc((100dvh - 200px) * 9 / 16));
            }
        }

        .preview-thumb::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 52%);
        }

        .preview-thumb-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 18px;
            z-index: 1;
        }

        .preview-name {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 600;
            font-variation-settings: 'SOFT' 0, 'WONK' 0;
            line-height: 1.1;
            color: #fff;
            margin: 0 0 4px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .preview-msg {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.72);
            margin: 0;
        }

        .preview-cta {
            padding: 14px 34px;
            font-family: var(--font-ui);
            font-size: 0.94rem;
            font-weight: 600;
            color: #16120b;
            background: var(--brass);
            border: none;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
        }

        .preview-cta:hover {
            background: var(--brass-bright);
            transform: translateY(-1px);
        }

        .preview-brand {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--paper-faint);
        }

        @media (max-width: 480px) {
            .preview-thumb { width: 60vw; }
            .preview-name { font-size: 1.2rem; }
        }

        /* ---------- Pantallas bajas ---------- */
        @media (max-height: 700px) and (max-width: 600px) {
            .vertical-icons {
                bottom: clamp(66px, 13vh, 104px);
                gap: 9px;
            }

            .icon-circle {
                width: clamp(26px, 9vw, 32px);
                height: clamp(26px, 9vw, 32px);
            }

            .qr-placeholder {
                width: clamp(50px, 16vw, 58px);
                height: clamp(50px, 16vw, 58px);
                bottom: clamp(12px, 3vh, 18px);
            }
        }
    </style>
</head>
<body class="card-body">
    <!-- Portada: se muestra antes de la tarjeta completa -->
    <div class="preview-splash" id="preview-splash">
        <div class="preview-thumb" id="preview-thumb">
            <div class="preview-thumb-content">
                <p class="preview-name" id="preview-name">Cargando…</p>
                <p class="preview-msg">Tarjeta de presentación digital</p>
            </div>
        </div>
        <button class="preview-cta" id="preview-cta">Ver tarjeta</button>
        <div class="preview-brand">E-Cards JM</div>
    </div>

    <!-- Tarjeta completa -->
    <div class="view-card-wrapper" id="card-view">
        <div class="card-overlay">
            <div class="card-head">
                <div class="card-logo" id="card-logo">
                    <img id="card-logo-img" src="" alt="">
                </div>
                <div class="card-identity">
                    <p class="card-name" id="card-name"></p>
                    <p class="card-role" id="card-role"></p>
                </div>
            </div>

            <div class="vertical-icons" id="vert-icons">
                <!-- Teléfono, correo y ubicación -->
            </div>

            <div class="social-row" id="soc-row">
                <!-- WhatsApp, LinkedIn, Instagram, TikTok, X, Facebook, YouTube, web -->
            </div>

            <div class="qr-placeholder" id="qrcode">
                <!-- El código QR se dibuja aquí -->
            </div>
        </div>
    </div>

    <script>
        let cardId = new URLSearchParams(window.location.search).get('u') ||
                     window.location.hash.split('/').pop() ||
                     window.location.pathname.split('/').pop();

        const cardView = document.getElementById('card-view');
        const previewSplash = document.getElementById('preview-splash');
        const previewThumb = document.getElementById('preview-thumb');
        const previewName = document.getElementById('preview-name');

        async function initCard() {
            if (!cardId || cardId === "#") {
                previewSplash.classList.add('hidden');
                showError("No se especificó ninguna tarjeta.");
                return;
            }

            try {
                const response = await fetch(`/api/cards/${cardId}`);
                if (response.ok) {
                    const card = await response.json();

                    // Portada
                    if (card.name) previewName.textContent = card.name;
                    if (card.bg_image_path) {
                        const bg = card.bg_image_path;
                        const bgUrl = bg.startsWith('url(') ? bg.slice(4, -1).replace(/["']/g, '') : bg;
                        previewThumb.style.backgroundImage = `url('${bgUrl}')`;
                    }

                    // Fondo de la tarjeta
                    if (card.bg_image_path) {
                        const bg = card.bg_image_path;
                        cardView.style.backgroundImage = bg.startsWith('url(') ? bg : `url('${bg}')`;
                    }

                    // Identificación
                    document.getElementById('card-name').textContent = card.name || '';
                    document.getElementById('card-role').textContent = card.title || card.company || '';

                    // Logo
                    if (card.logo_path) {
                        const logoContainer = document.getElementById('card-logo');
                        const logoImg = document.getElementById('card-logo-img');
                        logoImg.src = card.logo_path;
                        logoContainer.style.display = 'block';
                    }

                    renderVertical(card);
                    renderSocial(card);

                    const qrContainer = document.getElementById('qrcode');
                    const qrSize = Math.floor(qrContainer.getBoundingClientRect().width || 128);
                    new QRCode(qrContainer, {
                        text: window.location.href,
                        width: qrSize,
                        height: qrSize,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                    const qrImg = document.querySelector('#qrcode img');
                    if (qrImg) {
                        qrImg.style.width = '100%';
                        qrImg.style.height = '100%';
                        qrImg.style.maxWidth = '100%';
                        qrImg.style.maxHeight = '100%';
                        qrImg.style.objectFit = 'contain';
                    }
                    requestAnimationFrame(() => {
                        const qrImg2 = document.querySelector('#qrcode img');
                        if (qrImg2) {
                            qrImg2.style.width = '100%';
                            qrImg2.style.height = '100%';
                        }
                    });
                } else {
                    previewSplash.classList.add('hidden');
                    showError("Tarjeta no encontrada.");
                }
            } catch (err) {
                console.error("View card error:", err);
                previewSplash.classList.add('hidden');
                showError("Ocurrió un error al cargar los datos.");
            }
        }

        document.getElementById('preview-cta').addEventListener('click', function() {
            previewSplash.classList.add('hidden');
        });

        function renderVertical(card) {
            const container = document.getElementById('vert-icons');
            const fields = [
                { val: card.phone, icon: 'fa-phone', color: '#93c5fd', link: 'tel:' + card.phone },
                { val: card.email, icon: 'fa-envelope', color: '#e2e8f0', link: 'mailto:' + card.email },
                { val: card.address, icon: 'fa-location-dot', color: '#fda4af', link: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(card.address)}` }
            ];

            fields.forEach(f => {
                if (f.val && f.val.trim() !== "") {
                    container.innerHTML += `<a href="${f.link}" title="${f.val}" target="_blank" class="icon-circle" style="color:${f.color}"><i class="fa-solid ${f.icon}"></i></a>`;
                }
            });
        }

        function renderSocial(card) {
            const container = document.getElementById('soc-row');
            const fields = [
                { id: 'wa', val: card.whatsapp, icon: 'fa-brands fa-whatsapp', link: `https://wa.me/${(card.whatsapp||'').replace(/\D/g,'')}` },
                { id: 'li', val: card.linkedin, icon: 'fa-brands fa-linkedin-in', link: card.linkedin },
                { id: 'ig', val: card.instagram, icon: 'fa-brands fa-instagram', link: card.instagram?.startsWith('http') ? card.instagram : `https://instagram.com/${(card.instagram||'').replace('@','')}` },
                { id: 'tt', val: card.tiktok, icon: 'fa-brands fa-tiktok', link: card.tiktok?.startsWith('http') ? card.tiktok : `https://tiktok.com/@${(card.tiktok||'').replace('@','')}` },
                { id: 'tw', val: card.twitter, icon: 'fa-brands fa-x-twitter', link: card.twitter?.startsWith('http') ? card.twitter : `https://x.com/${(card.twitter||'').replace('@','')}` },
                { id: 'fb', val: card.facebook, icon: 'fa-brands fa-facebook-f', link: card.facebook?.startsWith('http') ? card.facebook : `https://facebook.com/${card.facebook}` },
                { id: 'yt', val: card.youtube, icon: 'fa-brands fa-youtube', link: card.youtube?.startsWith('http') ? card.youtube : `https://youtube.com/${(card.youtube || '').replace('@', '')}` },
                { id: 'web', val: card.website, icon: 'fa-solid fa-globe', link: card.website?.startsWith('http') ? card.website : `https://${card.website}` }
            ];

            fields.forEach(f => {
                if (f.val && f.val.trim() !== "") {
                    let finalLink = f.link;
                    if (f.id === 'li' && !finalLink.startsWith('http')) finalLink = `https://${finalLink}`;

                    container.innerHTML += `<a href="${finalLink}" target="_blank" class="icon-circle"><i class="${f.icon}"></i></a>`;
                }
            });
        }

        function showError(msg) {
            cardView.innerHTML = `<div style="color:#fff; text-align:center; padding:100px 30px; font-family: 'Archivo', system-ui, sans-serif;">
                <h1 style="font-size: 3.5rem; margin:0; font-family: 'Fraunces', Georgia, serif;">404</h1>
                <p style="opacity:0.7;">${msg}</p>
                <a href="/" style="color:#c68b3c; text-decoration:none; margin-top:20px; display:inline-block;">Volver al inicio</a>
            </div>`;
            cardView.style.background = "#12151c";
            cardView.style.backgroundImage = "none";
        }

        initCard();
    </script>
</body>
</html>
