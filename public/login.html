<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | E-Cards JM</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body.auth-body {
            min-height: 100vh;
        }

        .auth-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        /* Panel de marca: la mesa */
        .auth-brand {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 56px 6vw;
            background: var(--ink-sunken);
            border-right: 1px solid var(--ink-line);
            overflow: hidden;
        }

        .auth-brand::before {
            content: '';
            position: absolute;
            left: -160px;
            bottom: -220px;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(198, 139, 60, 0.16) 0%, transparent 65%);
            pointer-events: none;
        }

        .auth-brand-copy {
            position: relative;
            margin-top: auto;
            max-width: 30ch;
        }

        .auth-brand-copy h1 {
            margin-bottom: 18px;
        }

        .auth-brand-copy .lede {
            color: var(--paper-dim);
        }

        /* Tarjeta de muestra dibujada en CSS */
        .sample-card {
            position: relative;
            width: 178px;
            aspect-ratio: 9 / 16;
            margin: 8px 0 4px auto;
            background: var(--paper);
            border-radius: var(--r-card);
            transform: rotate(-4deg);
            box-shadow:
                0 1px 0 rgba(243, 238, 229, 0.12),
                0 40px 70px -30px rgba(0, 0, 0, 0.95);
            padding: 14px;
            display: flex;
            flex-direction: column;
        }

        .sample-card-photo {
            height: 42%;
            border-radius: 4px;
            background:
                radial-gradient(circle at 68% 26%, rgba(198, 139, 60, 0.55) 0%, transparent 58%),
                linear-gradient(150deg, #2b3242 0%, #12151c 100%);
        }

        .sample-card-name {
            height: 9px;
            width: 72%;
            margin-top: 16px;
            border-radius: 2px;
            background: #1b1f28;
        }

        .sample-card-role {
            height: 5px;
            width: 46%;
            margin-top: 8px;
            border-radius: 2px;
            background: #b3ab9b;
        }

        .sample-card-icons {
            display: flex;
            gap: 7px;
            margin-top: auto;
        }

        .sample-card-icons i {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid rgba(18, 21, 28, 0.35);
        }

        .sample-card-qr {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: 30px;
            height: 30px;
            background-color: #12151c;
            background-image:
                repeating-linear-gradient(0deg, #12151c 0 3px, transparent 3px 6px),
                repeating-linear-gradient(90deg, #12151c 0 3px, transparent 3px 6px);
            background-blend-mode: difference;
            border-radius: 3px;
        }

        /* Panel del formulario: la hoja */
        .auth-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px 6vw;
            background: var(--paper);
        }

        .auth-panel-inner {
            width: 100%;
            max-width: 380px;
        }

        .auth-panel h2 {
            margin-bottom: 10px;
        }

        .auth-note {
            font-size: 0.9rem;
            color: var(--ink-faint);
            margin-bottom: 32px;
        }

        .auth-submit {
            width: 100%;
            margin-top: 26px;
            padding: 15px;
        }

        .auth-error {
            margin-top: 16px;
            padding: 12px 14px;
            font-size: 0.88rem;
            color: #8f2d20;
            background: rgba(143, 45, 32, 0.08);
            border: 1px solid rgba(143, 45, 32, 0.22);
            border-radius: var(--r-sm);
        }

        .auth-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            font-size: 0.88rem;
            color: var(--ink-faint);
            text-decoration: none;
            transition: color var(--dur) var(--ease);
        }

        .auth-back:hover {
            color: var(--ink);
        }

        .auth-back svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 900px) {
            .auth-split {
                grid-template-columns: 1fr;
            }

            .auth-brand {
                padding: 32px 24px 44px;
                border-right: 0;
                border-bottom: 1px solid var(--ink-line);
                gap: 28px;
            }

            .auth-brand-copy {
                margin-top: 0;
            }

            .sample-card {
                display: none;
            }

            .auth-panel {
                padding: 48px 24px 64px;
            }
        }
    </style>
</head>
<body class="auth-body">
    <main class="auth-split">
        <section class="auth-brand">
            <a href="/index.html" class="wordmark">E-Cards <em>JM</em></a>

            <div class="auth-brand-copy">
                <h1 class="display-lg">Su presentación, siempre al día.</h1>
                <p class="lede">Entre para crear su tarjeta digital y compartirla con un enlace o un QR.</p>
            </div>

            <div class="sample-card" aria-hidden="true">
                <div class="sample-card-photo"></div>
                <div class="sample-card-name"></div>
                <div class="sample-card-role"></div>
                <div class="sample-card-icons"><i></i><i></i><i></i><i></i></div>
                <div class="sample-card-qr"></div>
            </div>
        </section>

        <section class="auth-panel on-paper">
            <div class="auth-panel-inner">
                <h2 class="display-md">Iniciar sesión</h2>
                <p class="auth-note">El acceso a E-Cards JM lo habilita el administrador de su organización.</p>

                <form id="loginForm">
                    <div class="field">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" placeholder="Tu usuario" required autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-brass auth-submit">Entrar</button>
                </form>

                <p id="error-msg" class="auth-error" role="alert" style="display: none;"></p>

                <a href="/index.html" class="auth-back">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                    Volver al inicio
                </a>
            </div>
        </section>
    </main>

    <script>
        // Inicio de sesión
        document.getElementById('loginForm').onsubmit = async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = "none";

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    localStorage.setItem('ecards_token', data.token);
                    localStorage.setItem('ecards_user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.innerText = data.message || data.error || "No pudimos iniciar sesión. Revise sus datos.";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "No pudimos conectar con el servidor. Intente de nuevo.";
                errorMsg.style.display = "block";
            }
        };
    </script>
</body>
</html>
