<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseñar tarjeta | E-Cards JM</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .create-container {
            display: grid;
            grid-template-columns: 440px 1fr;
            min-height: 100vh;
        }

        /* ---------- Panel de edición ---------- */
        .editor-pane {
            background: var(--ink-sunken);
            border-right: 1px solid var(--ink-line);
            padding: 30px 32px 120px;
            overflow-y: auto;
            height: 100vh;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--paper-dim);
            text-decoration: none;
            transition: color var(--dur) var(--ease);
        }

        .back-link:hover {
            color: var(--brass);
        }

        .back-link svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .editor-head {
            margin: 22px 0 8px;
        }

        .editor-head h1 {
            font-size: 1.7rem;
            margin-bottom: 6px;
        }

        .editor-head p {
            font-size: 0.85rem;
            color: var(--paper-faint);
        }

        .editor-block {
            margin-top: 34px;
            padding-top: 26px;
            border-top: 1px solid var(--ink-line);
        }

        .step {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .step-num {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            color: var(--brass);
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 22px 18px;
            text-align: center;
            border: 1px dashed var(--ink-line-strong);
            border-radius: var(--r-md);
            cursor: pointer;
            transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
        }

        .upload-area:hover {
            border-color: var(--brass);
            background: var(--brass-wash);
        }

        .upload-icon {
            font-size: 1.15rem;
            color: var(--paper-dim);
        }

        .upload-text {
            font-size: 0.88rem;
            font-weight: 600;
        }

        .upload-hint {
            font-size: 0.76rem;
            color: var(--paper-faint);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-row .field + .field {
            margin-top: 0;
        }

        .input-row + .field,
        .field + .input-row {
            margin-top: 16px;
        }

        /* ---------- Banco de pruebas ---------- */
        .preview-pane {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 56px 40px;
            background: var(--ink);
            overflow: hidden;
        }

        .preview-pane::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 720px;
            height: 720px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(243, 238, 229, 0.055) 0%, transparent 62%);
            pointer-events: none;
        }

        .preview-stage {
            position: relative;
            /* Ancho definido: si el escenario se encoge, el % de la tarjeta colapsa a 0 */
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .card-9-16 {
            position: relative;
            width: min(78%, 340px);
            aspect-ratio: 9 / 16;
            background: var(--ink-raised);
            background-size: cover;
            background-position: center;
            border-radius: var(--r-card);
            overflow: hidden;
            color: #fff;
            box-shadow:
                0 1px 0 rgba(243, 238, 229, 0.09),
                0 44px 80px -34px rgba(0, 0, 0, 0.95);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            /* Mismo velo que la tarjeta pública: mantiene legibles los iconos */
            background:
                linear-gradient(to top, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.08) 46%, transparent 72%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.48) 0%, transparent 34%);
        }

        .card-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        .card-logo {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(12, 14, 20, 0.45);
            display: none;
            flex: 0 0 auto;
        }

        .card-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-identity {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name {
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 600;
            font-variation-settings: 'SOFT' 0, 'WONK' 0;
            line-height: 1.1;
            letter-spacing: -0.015em;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
        }

        .card-role {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.78);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
        }

        .vertical-icons {
            position: absolute;
            left: 22px;
            bottom: 108px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-row {
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding-right: 96px;
        }

        .icon-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border: 1px solid currentColor;
            background: rgba(255, 255, 255, 0.9);
            transition: opacity var(--dur) var(--ease);
        }

        .qr-placeholder {
            position: absolute;
            right: 22px;
            bottom: 20px;
            width: 76px;
            height: 76px;
            background: #fff;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .qr-placeholder img,
        .qr-placeholder canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .preview-caption {
            position: relative;
            color: var(--paper-faint);
            text-align: center;
        }

        /* ---------- Aviso flotante ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 100px;
            z-index: 200;
            max-width: min(92vw, 520px);
            padding: 14px 18px;
            font-size: 0.9rem;
            color: var(--ink);
            background: var(--paper);
            border-radius: var(--r-sm);
            box-shadow: 0 20px 44px -20px rgba(0, 0, 0, 0.95);
            opacity: 0;
            transform: translate(-50%, 10px);
            pointer-events: none;
            transition: opacity 240ms var(--ease), transform 240ms var(--ease);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast.is-error {
            color: #fff;
            background: #8f2d20;
        }

        /* ---------- Acción principal ---------- */
        .floating-share {
            position: fixed;
            right: 28px;
            bottom: 28px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 24px;
            font-family: var(--font-ui);
            font-size: 0.94rem;
            font-weight: 600;
            color: #16120b;
            background: var(--brass);
            border: none;
            border-radius: var(--r-sm);
            cursor: pointer;
            box-shadow: 0 18px 36px -16px rgba(0, 0, 0, 0.9);
            transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
        }

        .floating-share:hover {
            background: var(--brass-bright);
            transform: translateY(-1px);
        }

        .floating-share:disabled {
            opacity: 0.65;
            cursor: progress;
            transform: none;
        }

        @media (max-width: 980px) {
            .create-container {
                grid-template-columns: 1fr;
            }

            .editor-pane {
                height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--ink-line);
                /* Espacio para que el botón flotante no tape el último campo */
                padding: 24px 20px 96px;
            }

            .preview-pane {
                padding: 48px 20px 120px;
            }

            .card-9-16 {
                width: min(80%, 320px);
            }

            .floating-share {
                left: 20px;
                right: 20px;
                bottom: 20px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="create-container">
        <aside class="editor-pane">
            <a href="/dashboard.html" class="back-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                Volver al panel
            </a>

            <header class="editor-head">
                <h1 class="display-md">Diseñar tarjeta</h1>
                <p>Vertical 9:16 · pensada para el móvil</p>
            </header>

            <section class="editor-block">
                <p class="step"><span class="step-num">01</span> Fondo de la tarjeta</p>
                <label class="upload-area">
                    <input type="file" id="bg-upload" hidden accept="image/*">
                    <i class="fa-solid fa-image upload-icon"></i>
                    <span class="upload-text">Subir imagen de fondo</span>
                    <span class="upload-hint">Se optimiza en el navegador: JPEG, hasta 1200 px</span>
                </label>
            </section>

            <section class="editor-block">
                <p class="step"><span class="step-num">02</span> Logo o foto de perfil</p>
                <label class="upload-area">
                    <input type="file" id="logo-upload" hidden accept="image/*">
                    <i class="fa-solid fa-circle-user upload-icon"></i>
                    <span class="upload-text">Subir logo o foto</span>
                    <span class="upload-hint">Circular, se recorta al centro</span>
                </label>
            </section>

            <section class="editor-block">
                <p class="step"><span class="step-num">03</span> Identificación</p>
                <div class="field">
                    <label for="in-name">Nombre y apellido</label>
                    <input type="text" id="in-name" placeholder="Juan Pérez" value="Juan Pérez">
                </div>
                <div class="input-row">
                    <div class="field">
                        <label for="in-title">Cargo</label>
                        <input type="text" id="in-title" placeholder="Director comercial">
                    </div>
                    <div class="field">
                        <label for="in-company">Empresa</label>
                        <input type="text" id="in-company" placeholder="Nombre de la empresa">
                    </div>
                </div>
            </section>

            <section class="editor-block">
                <p class="step"><span class="step-num">04</span> Contacto</p>
                <div class="field">
                    <label for="in-phone">Teléfono</label>
                    <input type="text" id="in-phone" placeholder="+57 300 000 0000">
                </div>
                <div class="field">
                    <label for="in-email">Correo</label>
                    <input type="email" id="in-email" placeholder="nombre@empresa.com">
                </div>
                <div class="field">
                    <label for="in-loc">Ubicación</label>
                    <input type="text" id="in-loc" placeholder="Ciudad, País">
                </div>
            </section>

            <section class="editor-block">
                <p class="step"><span class="step-num">05</span> Redes sociales</p>
                <div class="input-row">
                    <div class="field">
                        <label for="in-wa">WhatsApp</label>
                        <input type="text" id="in-wa" placeholder="Número o enlace">
                    </div>
                    <div class="field">
                        <label for="in-fb">Facebook</label>
                        <input type="text" id="in-fb" placeholder="Usuario o enlace">
                    </div>
                </div>
                <div class="input-row">
                    <div class="field">
                        <label for="in-ig">Instagram</label>
                        <input type="text" id="in-ig" placeholder="@usuario">
                    </div>
                    <div class="field">
                        <label for="in-li">LinkedIn</label>
                        <input type="text" id="in-li" placeholder="URL del perfil">
                    </div>
                </div>
                <div class="input-row">
                    <div class="field">
                        <label for="in-tt">TikTok</label>
                        <input type="text" id="in-tt" placeholder="@usuario">
                    </div>
                    <div class="field">
                        <label for="in-tw">X (Twitter)</label>
                        <input type="text" id="in-tw" placeholder="@usuario">
                    </div>
                </div>
                <div class="input-row">
                    <div class="field">
                        <label for="in-yt">YouTube</label>
                        <input type="text" id="in-yt" placeholder="Canal o enlace">
                    </div>
                    <div class="field">
                        <label for="in-web">Página web</label>
                        <input type="text" id="in-web" placeholder="https://...">
                    </div>
                </div>
            </section>
        </aside>

        <main class="preview-pane">
            <div class="preview-stage">
                <div class="card-9-16" id="card-preview">
                    <div class="card-overlay">
                        <div class="card-head">
                            <div class="card-logo" id="logo-preview-container">
                                <img id="logo-preview-img" src="" alt="">
                            </div>
                            <div class="card-identity">
                                <p class="card-name" id="preview-name">Su nombre</p>
                                <p class="card-role" id="preview-role">Su cargo</p>
                            </div>
                        </div>

                        <div class="vertical-icons">
                            <div class="icon-circle" id="view-phone" style="color: #2563eb;"><i class="fa-solid fa-phone"></i></div>
                            <div class="icon-circle" id="view-email" style="color: #475569;"><i class="fa-solid fa-envelope"></i></div>
                            <div class="icon-circle" id="view-loc" style="color: #e11d48;"><i class="fa-solid fa-location-dot"></i></div>
                        </div>

                        <div class="social-row">
                            <div class="icon-circle" id="view-wa" style="color: #16a34a;"><i class="fa-brands fa-whatsapp"></i></div>
                            <div class="icon-circle" id="view-li" style="color: #0a66c2;"><i class="fa-brands fa-linkedin-in"></i></div>
                            <div class="icon-circle" id="view-ig" style="color: #be185d;"><i class="fa-brands fa-instagram"></i></div>
                            <div class="icon-circle" id="view-tt" style="color: #111827;"><i class="fa-brands fa-tiktok"></i></div>
                            <div class="icon-circle" id="view-tw" style="color: #111827;"><i class="fa-brands fa-x-twitter"></i></div>
                            <div class="icon-circle" id="view-fb" style="color: #1d4ed8;"><i class="fa-brands fa-facebook-f"></i></div>
                            <div class="icon-circle" id="view-yt" style="color: #dc2626;"><i class="fa-brands fa-youtube"></i></div>
                            <div class="icon-circle" id="view-web" style="color: #0369a1;"><i class="fa-solid fa-globe"></i></div>
                        </div>

                        <div class="qr-placeholder" id="qr-preview"></div>
                    </div>
                </div>
            </div>

            <p class="preview-caption mono" id="preview-caption">/card/…</p>
        </main>
    </div>

    <button class="floating-share" onclick="generateLink()">
        <i class="fa-solid fa-link"></i>
        Guardar y copiar enlace
    </button>

    <script>
        // Comprobación de sesión
        const token = localStorage.getItem('ecards_token');
        if (!token) window.location.href = 'login.html';

        // Identificador de la tarjeta que se está editando
        const urlParams = new URLSearchParams(window.location.search);
        let editingId = urlParams.get('edit');

        const bgUpload = document.getElementById('bg-upload');
        const cardPreview = document.getElementById('card-preview');
        const logoUpload = document.getElementById('logo-upload');
        const logoContainer = document.getElementById('logo-preview-container');
        const logoImg = document.getElementById('logo-preview-img');
        let logoBase64 = null;

        bgUpload.addEventListener('change', async function() {
            const file = this.files[0];
            if (file) {
                try {
                    const compressedBase64 = await compressImage(file);
                    cardPreview.style.backgroundImage = `url('${compressedBase64}')`;
                    updatePreview();
                } catch (err) {
                    console.error("Compression error:", err);
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        cardPreview.style.backgroundImage = `url('${e.target.result}')`;
                        updatePreview();
                    }
                    reader.readAsDataURL(file);
                }
            }
        });

        logoUpload.addEventListener('change', async function() {
            const file = this.files[0];
            if (file) {
                try {
                    logoBase64 = await compressImage(file);
                    logoImg.src = logoBase64;
                    logoContainer.style.display = 'block';
                } catch (err) {
                    console.error("Logo compression error:", err);
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        logoBase64 = e.target.result;
                        logoImg.src = e.target.result;
                        logoContainer.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            }
        });

        async function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200; // Suficiente para móvil

                        if (width > height) {
                            if (width > maxDim) {
                                height *= maxDim / width;
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width *= maxDim / height;
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Vista previa en vivo
        const inputs = ['name', 'title', 'company', 'phone', 'email', 'loc', 'wa', 'fb', 'ig', 'li', 'tt', 'tw', 'yt', 'web'];
        inputs.forEach(id => {
            const el = document.getElementById('in-' + id);
            if (el) el.addEventListener('input', updatePreview);
        });

        function updatePreview() {
            toggleIcon('view-phone', 'in-phone');
            toggleIcon('view-email', 'in-email');
            toggleIcon('view-loc', 'in-loc');

            toggleIcon('view-wa', 'in-wa');
            toggleIcon('view-fb', 'in-fb');
            toggleIcon('view-ig', 'in-ig');
            toggleIcon('view-li', 'in-li');
            toggleIcon('view-tt', 'in-tt');
            toggleIcon('view-tw', 'in-tw');
            toggleIcon('view-yt', 'in-yt');
            toggleIcon('view-web', 'in-web');

            const name = document.getElementById('in-name').value.trim();
            const title = document.getElementById('in-title').value.trim();
            const company = document.getElementById('in-company').value.trim();

            document.getElementById('preview-name').innerText = name || 'Su nombre';
            document.getElementById('preview-role').innerText = title || company || 'Su cargo';

            updateQRPreview();
        }

        function updateQRPreview() {
            const qrContainer = document.getElementById('qr-preview');
            const nameInput = document.getElementById('in-name');
            const cardId = editingId || generateId(nameInput.value);
            const shareUrl = window.location.origin + '/card/' + cardId;

            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: shareUrl,
                width: 128,
                height: 128,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            const qrImg = qrContainer.querySelector('img');
            if (qrImg) {
                qrImg.style.width = '100%';
                qrImg.style.height = '100%';
            }

            document.getElementById('preview-caption').innerText = '/card/' + cardId;
        }

        function toggleIcon(iconId, inputId) {
            const input = document.getElementById(inputId);
            const iconEl = document.getElementById(iconId);
            if (!iconEl || !input) return;

            if (input.value.trim() === "") {
                iconEl.style.opacity = "0.2";
                iconEl.style.pointerEvents = "none";
            } else {
                iconEl.style.opacity = "1";
                iconEl.style.pointerEvents = "auto";
            }
        }

        function generateId(fullName) {
            return fullName.toLowerCase().trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/[\s_-]+/g, '-')
                .replace(/^-+|-+$/g, '') || 'card-' + Date.now();
        }

        async function saveCardData() {
            const name = document.getElementById('in-name').value;
            const cardId = editingId || generateId(name);

            let bgPath = cardPreview.style.backgroundImage;
            // Limpiar 'url("...")' para quedarse solo con la fuente
            if (bgPath.startsWith('url(')) {
                bgPath = bgPath.slice(4, -1).replace(/["']/g, "");
            }

            const cardData = {
                id: cardId,
                name: name,
                title: document.getElementById('in-title').value,
                company: document.getElementById('in-company').value,
                phone: document.getElementById('in-phone').value,
                email: document.getElementById('in-email').value,
                address: document.getElementById('in-loc').value,
                whatsapp: document.getElementById('in-wa').value,
                facebook: document.getElementById('in-fb').value,
                instagram: document.getElementById('in-ig').value,
                linkedin: document.getElementById('in-li').value,
                tiktok: document.getElementById('in-tt').value,
                twitter: document.getElementById('in-tw').value,
                youtube: document.getElementById('in-yt').value,
                website: document.getElementById('in-web').value,
                bg_image_path: bgPath,
                logo_path: logoBase64 || null
            };

            try {
                const response = await fetch('/api/cards', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(cardData)
                });

                if (!response.ok) {
                    let errData;
                    const responseText = await response.text();
                    try {
                        errData = JSON.parse(responseText);
                    } catch (e) {
                        errData = { error: 'SERVER_RESPONDED_HTML', detail: responseText.substring(0, 100) };
                    }
                    throw new Error(errData.error || errData.detail || 'Failed to save card');
                }

                return cardId;
            } catch (err) {
                console.error("Save error:", err);
                showToast('No pudimos guardar la tarjeta: ' + err.message, 'error');
                return null;
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast' + (type === 'error' ? ' is-error' : '');
            toast.innerText = message;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4200);
        }

        async function generateLink() {
            const btn = document.querySelector('.floating-share');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = 'Guardando…';
            btn.disabled = true;

            try {
                const cardId = await saveCardData();
                if (cardId) {
                    const shareUrl = window.location.origin + '/card/' + cardId;

                    try {
                        await navigator.clipboard.writeText(shareUrl);
                    } catch (e) {
                        console.warn('No se pudo copiar al portapapeles:', e);
                    }

                    showToast('Tarjeta guardada. Enlace copiado: ' + shareUrl);
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1400);
                } else {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("Critical error in generateLink:", err);
                showToast("Ocurrió un error inesperado. Revise la consola e inténtelo de nuevo.", 'error');
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // Carga de la tarjeta que se está editando
        async function init() {
            if (editingId) {
                try {
                    const response = await fetch(`/api/cards/${editingId}`);
                    if (response.ok) {
                        const data = await response.json();
                        document.getElementById('in-name').value = data.name || '';
                        document.getElementById('in-title').value = data.title || '';
                        document.getElementById('in-company').value = data.company || '';
                        document.getElementById('in-phone').value = data.phone || '';
                        document.getElementById('in-email').value = data.email || '';
                        document.getElementById('in-loc').value = data.address || '';
                        document.getElementById('in-wa').value = data.whatsapp || '';
                        document.getElementById('in-fb').value = data.facebook || '';
                        document.getElementById('in-ig').value = data.instagram || '';
                        document.getElementById('in-li').value = data.linkedin || '';
                        document.getElementById('in-tt').value = data.tiktok || '';
                        document.getElementById('in-tw').value = data.twitter || '';
                        document.getElementById('in-yt').value = data.youtube || '';
                        document.getElementById('in-web').value = data.website || '';
                        if (data.bg_image_path) {
                            const bg = data.bg_image_path;
                            cardPreview.style.backgroundImage = bg.startsWith('url(') ? bg : `url('${bg}')`;
                        }
                        if (data.logo_path) {
                            logoBase64 = data.logo_path;
                            logoImg.src = data.logo_path;
                            logoContainer.style.display = 'block';
                        }
                        updatePreview();
                    }
                } catch (err) {
                    console.error("Load error:", err);
                }
            } else {
                updatePreview();
            }
        }

        init();
    </script>
</body>
